name: Build Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/techassist
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "TechAssist"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.techassist'
              compileSdk 34
              defaultConfig { applicationId "com.example.techassist"; minSdk 24; targetSdk 34; versionCode 27; versionName "27.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="@string/app_name" android:supportsRtl="true" android:theme="@style/Theme.TechAssist">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".AssistService" android:exported="false" android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/techassist/MainActivity.kt
          package com.example.techassist
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var btnStart: Button
              private lateinit var btnExit: Button
              private val overlayPermLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) {
                  if (Settings.canDrawOverlays(this)) requestWriteSettingsOrStart() else toast("未授予悬浮窗权限")
              }
              private val writeSettingsLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { startAssistService() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  btnStart = findViewById(R.id.btnStart)
                  btnExit = findViewById(R.id.btnExit)
                  btnStart.applyPressEffect()
                  btnExit.applyPressEffect()
                  btnStart.setOnClickListener { onStartClicked() }
                  btnExit.setOnClickListener {
                      stopService(Intent(this, AssistService::class.java))
                      finishAffinity()
                  }
              }

              private fun onStartClicked() {
                  if (!Settings.canDrawOverlays(this)) {
                      try {
                          overlayPermLauncher.launch(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } catch (e: Exception) { toast("请手动去设置里授予悬浮窗权限") }
                  } else { requestWriteSettingsOrStart() }
              }

              private fun requestWriteSettingsOrStart() {
                  try {
                      if (!Settings.System.canWrite(this)) {
                          writeSettingsLauncher.launch(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName")))
                      } else { startAssistService() }
                  } catch (e: Exception) { startAssistService() }
              }

              private fun startAssistService() {
                  val intent = Intent(this, AssistService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                  toast("辅助已启动")
                  moveTaskToBack(true)
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              private fun View.applyPressEffect() {
                  setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.97f).scaleY(0.97f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      }
                      false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/techassist/AssistService.kt
          package com.example.techassist
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.IBinder
          import android.os.Vibrator
          import android.provider.AlarmClock
          import android.provider.CalendarContract
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.roundToInt

          class AssistService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var audioManager: AudioManager
              private lateinit var panel: View
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var mainPanel: LinearLayout
              private lateinit var miniIcon: TextView
              private lateinit var tvBrightness: TextView
              private lateinit var tvVolume: TextView
              private lateinit var sbBrightness: SeekBar
              private lateinit var sbVolume: SeekBar
              private lateinit var btnMute: Button
              private lateinit var btnStreamSwitch: Button
              private lateinit var switchAuto: Switch
              private lateinit var colorDots: LinearLayout
              private lateinit var tabBasic: View
              private lateinit var tabSystem: View
              private lateinit var tabQuick: View
              private lateinit var tabJump: View
              private lateinit var tabAppear: View
              private lateinit var tab1: TextView
              private lateinit var tab2: TextView
              private lateinit var tab3: TextView
              private lateinit var tab4: TextView
              private lateinit var tab5: TextView

              private var currentStream = AudioManager.STREAM_MUSIC
              private var isMuted = false
              private var panelWidthPx = 0
              private var currentAlpha = 1.0f
              private var isFlashlightOn = false
              private var isKeepScreenOn = false
              private var isNightMode = false
              private var cameraManager: CameraManager? = null
              private var cameraId: String? = null
              private var normalBrightness = 0.6f

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  audioManager = getSystemService(AUDIO_SERVICE) as AudioManager
                  cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  try { cameraId = cameraManager?.cameraIdList?.firstOrNull() } catch (e: Exception) {}
                  buildPanel()
              }

              private fun startForegroundNotification() {
                  val channelId = "tech_assist_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "科技辅助", NotificationManager.IMPORTANCE_LOW)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId).setContentTitle("科技辅助运行中").setSmallIcon(android.R.drawable.ic_menu_compass).build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this).setContentTitle("科技辅助运行中").setSmallIcon(android.R.drawable.ic_menu_compass).build()
                  }
                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              private fun buildPanel() {
                  panel = LayoutInflater.from(this).inflate(R.layout.window_assist, null)
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  panelWidthPx = dp(310)
                  params = WindowManager.LayoutParams(panelWidthPx, WindowManager.LayoutParams.WRAP_CONTENT, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(120)
                      alpha = currentAlpha
                  }
                  windowManager.addView(panel, params)

                  mainPanel = panel.findViewById(R.id.mainPanel)
                  miniIcon = panel.findViewById(R.id.miniIcon)
                  tvBrightness = panel.findViewById(R.id.tvBrightnessValue)
                  tvVolume = panel.findViewById(R.id.tvVolumeValue)
                  sbBrightness = panel.findViewById(R.id.sbBrightness)
                  sbVolume = panel.findViewById(R.id.sbVolume)
                  btnMute = panel.findViewById(R.id.btnMute)
                  btnStreamSwitch = panel.findViewById(R.id.btnStreamSwitch)
                  switchAuto = panel.findViewById(R.id.switchAutoBrightness)
                  colorDots = panel.findViewById(R.id.colorDots)
                  tabBasic = panel.findViewById(R.id.tabBasic)
                  tabSystem = panel.findViewById(R.id.tabSystem)
                  tabQuick = panel.findViewById(R.id.tabQuick)
                  tabJump = panel.findViewById(R.id.tabJump)
                  tabAppear = panel.findViewById(R.id.tabAppear)
                  tab1 = panel.findViewById(R.id.tab1)
                  tab2 = panel.findViewById(R.id.tab2)
                  tab3 = panel.findViewById(R.id.tab3)
                  tab4 = panel.findViewById(R.id.tab4)
                  tab5 = panel.findViewById(R.id.tab5)

                  setupDrag(panel.findViewById(R.id.dragHandle))
                  setupMiniDrag(miniIcon)
                  setupResizeHandle(panel.findViewById(R.id.resizeHandle))
                  setupBrightness()
                  setupVolume()
                  setupButtons()
                  setupAlphaSlider()
                  setupColorDots()
                  setupTabs()

                  panel.findViewById<View>(R.id.btnClose).setOnClickListener { stopSelf() }
                  panel.findViewById<View>(R.id.btnMinimize).setOnClickListener { minimize() }
                  panel.findViewById<View>(R.id.btnHide).setOnClickListener { toggleHide() }
              }

              private fun setupTabs() {
                  tab1.setOnClickListener { switchTab(0) }
                  tab2.setOnClickListener { switchTab(1) }
                  tab3.setOnClickListener { switchTab(2) }
                  tab4.setOnClickListener { switchTab(3) }
                  tab5.setOnClickListener { switchTab(4) }
                  switchTab(0)
              }

              private fun switchTab(index: Int) {
                  tabBasic.visibility = if (index == 0) View.VISIBLE else View.GONE
                  tabSystem.visibility = if (index == 1) View.VISIBLE else View.GONE
                  tabQuick.visibility = if (index == 2) View.VISIBLE else View.GONE
                  tabJump.visibility = if (index == 3) View.VISIBLE else View.GONE
                  tabAppear.visibility = if (index == 4) View.VISIBLE else View.GONE
                  tab1.setBackgroundColor(if (index == 0) 0xFF22D3EE.toInt() else 0x00000000)
                  tab2.setBackgroundColor(if (index == 1) 0xFF22D3EE.toInt() else 0x00000000)
                  tab3.setBackgroundColor(if (index == 2) 0xFF22D3EE.toInt() else 0x00000000)
                  tab4.setBackgroundColor(if (index == 3) 0xFF22D3EE.toInt() else 0x00000000)
                  tab5.setBackgroundColor(if (index == 4) 0xFF22D3EE.toInt() else 0x00000000)
                  tab1.setTextColor(if (index == 0) 0xFF0A1526.toInt() else 0xFF9FD8EA.toInt())
                  tab2.setTextColor(if (index == 1) 0xFF0A1526.toInt() else 0xFF9FD8EA.toInt())
                  tab3.setTextColor(if (index == 2) 0xFF0A1526.toInt() else 0xFF9FD8EA.toInt())
                  tab4.setTextColor(if (index == 3) 0xFF0A1526.toInt() else 0xFF9FD8EA.toInt())
                  tab5.setTextColor(if (index == 4) 0xFF0A1526.toInt() else 0xFF9FD8EA.toInt())
              }

              private fun toggleHide() {
                  val v = tabBasic.visibility
                  val newVis = if (v == View.GONE) View.VISIBLE else View.GONE
                  tabBasic.visibility = newVis
                  tabSystem.visibility = newVis
                  tabQuick.visibility = newVis
                  tabJump.visibility = newVis
                  tabAppear.visibility = newVis
              }

              private fun setupColorDots() {
                  colorDots.removeAllViews()
                  val ids = intArrayOf(R.drawable.bg_panel, R.drawable.bg_panel_blue, R.drawable.bg_panel_purple, R.drawable.bg_panel_green, R.drawable.bg_panel_red, R.drawable.bg_panel_orange, R.drawable.bg_panel_pink, R.drawable.bg_panel_gray)
                  val colors = intArrayOf(0xFF22D3EE.toInt(), 0xFF3B82F6.toInt(), 0xFFA855F7.toInt(), 0xFF10B981.toInt(), 0xFFEF4444.toInt(), 0xFFF97316.toInt(), 0xFFEC4899.toInt(), 0xFF64748B.toInt())
                  var i = 0
                  while (i < ids.size) {
                      val dot = View(this)
                      val lp = LinearLayout.LayoutParams(dp(20), dp(20))
                      lp.marginEnd = dp(6)
                      dot.layoutParams = lp
                      dot.setBackgroundColor(colors[i])
                      val did = ids[i]
                      dot.setOnClickListener { mainPanel.setBackgroundResource(did) }
                      colorDots.addView(dot)
                      i++
                  }
              }

              private fun setupMiniDrag(handle: View) {
                  var startX = 0; var startY = 0; var downX = 0f; var downY = 0f; var moved = false
                  handle.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> { startX = params.x; startY = params.y; downX = event.rawX; downY = event.rawY; moved = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.rawX - downX; val dy = event.rawY - downY
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              params.x = startX + dx.toInt(); params.y = startY + dy.toInt()
                              windowManager.updateViewLayout(panel, params); true
                          }
                          MotionEvent.ACTION_UP -> { if (!moved) restore() else snapToEdge(); false }
                          else -> false
                      }
                  }
              }

              private fun snapToEdge() {
                  val screenWidth = resources.displayMetrics.widthPixels
                  val centerX = params.x + params.width / 2
                  if (centerX < screenWidth / 2) params.x = dp(8) else params.x = screenWidth - params.width - dp(8)
                  windowManager.updateViewLayout(panel, params)
              }

              private fun minimize() {
                  mainPanel.visibility = View.GONE
                  miniIcon.visibility = View.VISIBLE
                  params.width = WindowManager.LayoutParams.WRAP_CONTENT
                  params.height = WindowManager.LayoutParams.WRAP_CONTENT
                  windowManager.updateViewLayout(panel, params)
              }

              private fun restore() {
                  mainPanel.visibility = View.VISIBLE
                  miniIcon.visibility = View.GONE
                  params.width = panelWidthPx
                  params.height = WindowManager.LayoutParams.WRAP_CONTENT
                  windowManager.updateViewLayout(panel, params)
              }

              private fun setupAlphaSlider() {
                  val sbAlpha = panel.findViewById<SeekBar>(R.id.sbAlpha)
                  sbAlpha.progress = (currentAlpha * 100).toInt()
                  sbAlpha.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) { currentAlpha = (progress.coerceIn(20, 100)) / 100f; params.alpha = currentAlpha; windowManager.updateViewLayout(panel, params) }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })
              }

              private fun setupButtons() {
                  btnMute.setOnClickListener {
                      isMuted = !isMuted
                      audioManager.adjustStreamVolume(currentStream, if (isMuted) AudioManager.ADJUST_MUTE else AudioManager.ADJUST_UNMUTE, AudioManager.FLAG_SHOW_UI)
                      btnMute.text = if (isMuted) "已静音" else "正常"
                      updateVolumeSlider()
                  }
                  btnStreamSwitch.setOnClickListener {
                      currentStream = if (currentStream == AudioManager.STREAM_MUSIC) AudioManager.STREAM_RING else AudioManager.STREAM_MUSIC
                      btnStreamSwitch.text = if (currentStream == AudioManager.STREAM_MUSIC) "媒体" else "铃声"
                      updateVolumeSlider()
                  }
                  // 基础 Tab 新增
                  panel.findViewById<View>(R.id.btnBrightAuto).setOnClickListener { sbBrightness.progress = 0; switchAuto.isChecked = true }
                  panel.findViewById<View>(R.id.btnBright50).setOnClickListener { sbBrightness.progress = 50; applyBrightness(50) }
                  panel.findViewById<View>(R.id.btnVol0).setOnClickListener { sbVolume.progress = 0; applyVolume(0) }
                  panel.findViewById<View>(R.id.btnVol100).setOnClickListener { sbVolume.progress = 100; applyVolume(100) }
                  // 系统 Tab 新增
                  panel.findViewById<View>(R.id.btnCopyTime).setOnClickListener { copyTime() }
                  panel.findViewById<View>(R.id.btnBatteryInfo).setOnClickListener { showBattery() }
                  panel.findViewById<View>(R.id.btnTimeInfo).setOnClickListener { showTime() }
                  panel.findViewById<View>(R.id.btnOpenSettings).setOnClickListener { openSetting(Settings.ACTION_SETTINGS) }
                  // 快捷 Tab 新增
                  panel.findViewById<View>(R.id.btnContacts).setOnClickListener { openContacts() }
                  panel.findViewById<View>(R.id.btnGallery).setOnClickListener { openGallery() }
                  panel.findViewById<View>(R.id.btnClock).setOnClickListener { launchApp("com.android.deskclock") }
                  panel.findViewById<View>(R.id.btnFileManager).setOnClickListener { launchApp("com.android.documentsui") }
                  // 跳转 Tab 新增
                  panel.findViewById<View>(R.id.btnLanguage).setOnClickListener { openSetting(Settings.ACTION_LOCALE_SETTINGS) }
                  panel.findViewById<View>(R.id.btnAccount).setOnClickListener { openSetting(Settings.ACTION_SYNC_SETTINGS) }
                  panel.findViewById<View>(R.id.btnSoundSettings).setOnClickListener { openSetting(Settings.ACTION_SOUND_SETTINGS) }

                  // 基础旧功能
                  panel.findViewById<View>(R.id.btnBrightMinus).setOnClickListener { changeBrightness(-5) }
                  panel.findViewById<View>(R.id.btnBrightPlus).setOnClickListener { changeBrightness(5) }
                  panel.findViewById<View>(R.id.btnVolMinus).setOnClickListener { changeVolume(-5) }
                  panel.findViewById<View>(R.id.btnVolPlus).setOnClickListener { changeVolume(5) }
                  // 系统旧功能
                  panel.findViewById<View>(R.id.btnFlashlight).setOnClickListener { toggleFlashlight() }
                  panel.findViewById<View>(R.id.btnKeepScreenOn).setOnClickListener { toggleKeepScreenOn() }
                  panel.findViewById<View>(R.id.btnNight).setOnClickListener { toggleNightMode() }
                  panel.findViewById<View>(R.id.btnHome).setOnClickListener { goHome() }
                  panel.findViewById<View>(R.id.btnSleep).setOnClickListener { Toast.makeText(this, "请按电源键息屏", Toast.LENGTH_SHORT).show() }
                  panel.findViewById<View>(R.id.btnMaxBrightness).setOnClickListener { sbBrightness.progress = 100; applyBrightness(100) }
                  panel.findViewById<View>(R.id.btnMinBrightness).setOnClickListener { sbBrightness.progress = 1; applyBrightness(1) }
                  panel.findViewById<View>(R.id.btnRingerMode).setOnClickListener { cycleRingerMode() }
                  panel.findViewById<View>(R.id.btnClearClip).setOnClickListener { clearClipboard() }
                  panel.findViewById<View>(R.id.btnCopyDevice).setOnClickListener { copyDeviceInfo() }
                  panel.findViewById<View>(R.id.btnVibrate).setOnClickListener { vibrate() }
                  // 快捷旧功能
                  panel.findViewById<View>(R.id.btnWeChat).setOnClickListener { launchApp("com.tencent.mm") }
                  panel.findViewById<View>(R.id.btnQQ).setOnClickListener { launchApp("com.tencent.mobileqq") }
                  panel.findViewById<View>(R.id.btnAlipay).setOnClickListener { launchApp("com.eg.android.AlipayGphone") }
                  panel.findViewById<View>(R.id.btnDouyin).setOnClickListener { launchApp("com.ss.android.ugc.aweme") }
                  panel.findViewById<View>(R.id.btnCamera).setOnClickListener { launchApp("com.android.camera") }
                  panel.findViewById<View>(R.id.btnPhone).setOnClickListener { dialPhone() }
                  panel.findViewById<View>(R.id.btnSms).setOnClickListener { openSms() }
                  panel.findViewById<View>(R.id.btnCalculator).setOnClickListener { launchApp("com.android.calculator2") }
                  panel.findViewById<View>(R.id.btnCalendar).setOnClickListener { openCalendar() }
                  panel.findViewById<View>(R.id.btnMusic).setOnClickListener { launchApp("com.android.music") }
                  panel.findViewById<View>(R.id.btnAlarm).setOnClickListener { openAlarm() }
                  panel.findViewById<View>(R.id.btnEmail).setOnClickListener { launchApp("com.android.email") }
                  panel.findViewById<View>(R.id.btnMarket).setOnClickListener { openMarket() }
                  panel.findViewById<View>(R.id.btnBrowser).setOnClickListener { openBrowser() }
                  // 跳转旧功能
                  panel.findViewById<View>(R.id.btnWifi).setOnClickListener { openSetting(Settings.ACTION_WIFI_SETTINGS) }
                  panel.findViewById<View>(R.id.btnBluetooth).setOnClickListener { openSetting(Settings.ACTION_BLUETOOTH_SETTINGS) }
                  panel.findViewById<View>(R.id.btnAirplane).setOnClickListener { openSetting(Settings.ACTION_AIRPLANE_MODE_SETTINGS) }
                  panel.findViewById<View>(R.id.btnBattery).setOnClickListener { openSetting(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS) }
                  panel.findViewById<View>(R.id.btnPerm).setOnClickListener { openSetting(Settings.ACTION_APPLICATION_DETAILS_SETTINGS) }
                  panel.findViewById<View>(R.id.btnLocation).setOnClickListener { openSetting(Settings.ACTION_LOCATION_SOURCE_SETTINGS) }
                  panel.findViewById<View>(R.id.btnDev).setOnClickListener { openSetting(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS) }
                  panel.findViewById<View>(R.id.btnStorage).setOnClickListener { openSetting(Settings.ACTION_INTERNAL_STORAGE_SETTINGS) }
                  panel.findViewById<View>(R.id.btnAccessibility).setOnClickListener { openSetting(Settings.ACTION_ACCESSIBILITY_SETTINGS) }
                  panel.findViewById<View>(R.id.btnInputMethod).setOnClickListener { openSetting(Settings.ACTION_INPUT_METHOD_SETTINGS) }
                  panel.findViewById<View>(R.id.btnNotification).setOnClickListener { openSetting("android.settings.APP_NOTIFICATION_SETTINGS") }
                  panel.findViewById<View>(R.id.btnDateTime).setOnClickListener { openSetting(Settings.ACTION_DATE_SETTINGS) }
                  // 外观 Tab 旧功能
                  panel.findViewById<View>(R.id.btnClipboard).setOnClickListener { showClipboard() }

                  switchAuto.setOnCheckedChangeListener { _, isChecked ->
                      try {
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, if (isChecked) Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC else Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                          sbBrightness.isEnabled = !isChecked
                      } catch (e: Exception) { switchAuto.isChecked = !isChecked }
                  }
                  try {
                      val mode = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE)
                      switchAuto.isChecked = mode == Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC
                      sbBrightness.isEnabled = !switchAuto.isChecked
                  } catch (e: Exception) {}
              }

              private fun copyTime() {
