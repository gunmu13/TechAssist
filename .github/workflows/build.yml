          echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><gradient android:angle="0" android:centerColor="#FF22D3EE" android:endColor="#0022D3EE" android:startColor="#0022D3EE" /></shape>' > app/src/main/res/drawable/line_gradient.xml
          echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><gradient android:angle="0" android:centerColor="#8822D3EE" android:endColor="#0022D3EE" android:startColor="#0022D3EE" /></shape>' > app/src/main/res/drawable/line_divider.xml
          echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="20dp" /><solid android:color="#CC0A1526" /><stroke android:width="1dp" android:color="#6622D3EE" /></shape>' > app/src/main/res/drawable/bg_mini_icon.xml
          echo '<?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:topLeftRadius="8dp" android:bottomRightRadius="8dp" /><solid android:color="#3322D3EE" /><stroke android:width="1dp" android:color="#6622D3EE" /></shape>' > app/src/main/res/drawable/bg_resize_handle.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.TechAssist" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowBackground">@android:color/white</item><item name="android:statusBarColor">@android:color/white</item><item name="android:navigationBarColor">@android:color/white</item></style></resources>' > app/src/main/res/values/themes.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">科技辅助</string></resources>' > app/src/main/res/values/strings.xml

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechAssist-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
