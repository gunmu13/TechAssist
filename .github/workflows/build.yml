name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build APK (自动消灭空格)
        run: |
          mkdir -p extracted
          # 1. 精准解压
          unzip -q TechAssist.zip -d extracted
          cd extracted

          # 2. ⭐ 魔法核心：从底层往上，把所有文件/文件夹名字里的空格全部删掉！
          find . -depth -name "* *" | while read f; do
            mv "$f" "$(echo "$f" | tr -d ' ')" 2>/dev/null || true
          done

          # 3. 自动寻找真正的项目根目录（以 settings.gradle 为标志）
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          echo "✅ 找到项目文件夹: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 4. 开始编译
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechAssist-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
