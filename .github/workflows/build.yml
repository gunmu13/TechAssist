              private fun cycleRingerMode() {
                  try {
                      val current = audioManager.ringerMode
                      val next = when (current) {
                          AudioManager.RINGER_MODE_SILENT -> AudioManager.RINGER_MODE_VIBRATE
                          AudioManager.RINGER_MODE_VIBRATE -> AudioManager.RINGER_MODE_NORMAL
                          else -> AudioManager.RINGER_MODE_SILENT
                      }
                      audioManager.ringerMode = next
                      val name = when (next) {
                          AudioManager.RINGER_MODE_SILENT -> "静音"
                          AudioManager.RINGER_MODE_VIBRATE -> "震动"
                          else -> "响铃"
                      }
                      Toast.makeText(this, "模式: $name", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) { Toast.makeText(this, "切换失败", Toast.LENGTH_SHORT).show() }
              }

