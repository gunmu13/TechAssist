name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          mkdir -p ./project
          unzip -q *.zip -d ./project
          if [ ! -f "./project/settings.gradle" ]; then
            DIR=$(find ./project -name "settings.gradle" -exec dirname {} \; | head -n 1)
            echo "项目目录为: $DIR"
            mv $DIR/* ./project/ 2>/dev/null || true
            mv $DIR/.[!.]* ./project/ 2>/dev/null || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4 # ⭐ 强制使用8.4版本

      - name: Build Debug APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechAssist-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
