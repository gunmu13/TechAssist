name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Fix Names
        run: |
          mkdir -p project
          unzip -q *.zip -d project
          # 自动寻找真实项目根目录
          if [ -d "project/TechAssist" ]; then
            mv project/TechAssist/* project/
            mv project/TechAssist/.[!.]* project/ 2>/dev/null || true
          elif [ ! -f "project/settings.gradle" ]; then
            DIR=$(find project -name "settings.gradle" -exec dirname {} \; | head -n 1)
            if [ ! -z "$DIR" ]; then
              mv $DIR/* project/
              mv $DIR/.[!.]* project/ 2>/dev/null || true
            fi
          fi

          cd project
          # ⭐ 魔法操作：自动删除所有文件名和文件夹名中的空格
          find . -name "* *" | while read file; do
            newfile=$(echo "$file" | tr -d ' ')
            mv "$file" "$newfile"
          done

          # 自动修复 AndroidManifest.xml 位置
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            FOUND=$(find . -name "AndroidManifest.xml" | head -n 1)
            if [ ! -z "$FOUND" ]; then
              echo "找到 AndroidManifest.xml，位置在: $FOUND，自动修复中..."
              mkdir -p app/src/main
              cp "$FOUND" app/src/main/AndroidManifest.xml
            else
              echo "⚠️ 严重错误：你的压缩包里根本没有 AndroidManifest.xml，请去 MT 管理器里检查！"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechAssist-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
